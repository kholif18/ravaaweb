# ============================================================
# RavaaWeb — Production Stack
# ============================================================

services:
  # ----------------------------------------------------------
  # Main application (PHP 8.4 + Apache)
  # ----------------------------------------------------------
  app:
    container_name: RavaaWeb-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
    environment:
      # — Application
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: "${APP_URL:-http://localhost}"
      APP_KEY: "${APP_KEY}"

      # — Database (MariaDB)
      DB_CONNECTION: mariadb
      DB_HOST: "${DB_HOST:-mariadb}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-web}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD}"

      # — Cache & Session (database)
      CACHE_STORE: database
      SESSION_DRIVER: database

      # — Mail
      MAIL_MAILER: "${MAIL_MAILER:-log}"

      # — Queue
      QUEUE_CONNECTION: database

      # — Filesystem
      FILESYSTEM_DISK: local
    volumes:
      # Persistent storage (user uploads, logs, session files if needed)
      - storage_data:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - ravaaweb

  # ----------------------------------------------------------
  # MariaDB (database)
  # ----------------------------------------------------------
  mariadb:
    container_name: RavaaWeb-db
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-web}"
      MYSQL_USER: "${DB_USERNAME:-root}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ravaaweb

volumes:
  storage_data:
  mariadb_data:

networks:
  ravaaweb:
    driver: bridge
