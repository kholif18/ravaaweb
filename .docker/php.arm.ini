[PHP]
; HG680P — ARM64 tuning
memory_limit = 128M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_time = 120
max_input_vars = 3000
date.timezone = Asia/Jakarta
zend.assertions = -1

; ARM64-specific
; realpath_cache improves performance on eMMC storage
realpath_cache_size = 4096K
realpath_cache_ttl = 600
